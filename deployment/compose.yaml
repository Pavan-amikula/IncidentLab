# Research serving package. This does not provision Kubernetes or raw telemetry collectors.
services:
  incidentlab:
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 256
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "127.0.0.1:8769:8768"
    volumes:
      - ../data/processed:/app/data/processed:ro
      - ../artifacts:/app/artifacts
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8768/api/status', timeout=10)"]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3
